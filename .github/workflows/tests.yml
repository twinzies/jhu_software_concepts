name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (module_4)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module_4

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite creates and truncates this database; it never touches the app's own.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/module_4_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the full suite with coverage
        run: python -m pytest
