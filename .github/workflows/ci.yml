name: ci

# Shift-left security: every push and PR is linted, graphed, scanned and tested.
on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: module_5

jobs:
  pylint:
    name: Pylint (fail under 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pylint src --fail-under=10

  dependency-graph:
    name: Dependency graph (pydeps + Graphviz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -r requirements.txt
      - name: Generate dependency.svg
        working-directory: module_5/src
        run: >-
          rm -f ../dependency.svg &&
          python -m pydeps . --max-bacon 3 --max-module-depth 2
          -x src.db src.sql_safety src.load_data src.query_data src.models src.scrape
          'psycopg.*' 'flask.*' 'sqlalchemy.*' 'selenium.*' 'urllib3.*'
          --noshow -T svg -o ../dependency.svg
      - name: Fail if dependency.svg is missing or empty
        run: test -s dependency.svg
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: module_5/dependency.svg

  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt
      # Snyk resolves Python dependencies from the installed environment.
      - run: python -m pip install -r requirements.txt
      - run: npm install -g snyk
      - name: snyk test (fails on high or critical issues)
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

  pytest:
    name: Pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The suite creates and truncates this database; it never touches the app's own.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/module_5_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the suite (fails on any test failure or coverage below 100%)
        run: python -m pytest
